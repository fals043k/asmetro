<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель управления</title>
<style>
:root[data-theme="light"]{--bg-page:#f0f2f5;--bg-surface:#ffffff;--bg-elevated:#f8f9fa;--text-primary:#1a1a2e;--text-secondary:#4a4a68;--text-muted:#6c757d;--border-subtle:#d0d4dc;--border-default:#c0c5cf;--border-focus:#0056b3;--primary:#0056b3;--primary-hover:#004494;--primary-bg:#cfe4ff;--danger:#b31d28;--danger-hover:#941620;--danger-bg:#ffe0e0;--secondary:#546e7a;--secondary-hover:#455a64;--success:#146c2e;--success-bg:#d4edda;--warning:#b8860b;--warning-bg:#fff3cd;--shadow-sm:0 1px 2px rgba(0,0,0,0.08);--shadow-md:0 2px 8px rgba(0,0,0,0.1);--shadow-lg:0 4px 20px rgba(0,0,0,0.15);--radius-sm:4px;--radius-md:6px;--radius-lg:8px;--focus-ring:0 0 0 3px rgba(0,86,179,0.2);--file-input-bg:#f8f9fa;--file-input-border:#c0c5cf;--status-exists:#146c2e;--status-pending:#0056b3;--status-missing:#6c757d;--transition-fast:150ms ease;--transition-normal:250ms ease;--invisible-opacity:0.5}
:root[data-theme="dark"]{--bg-page:#0a0c10;--bg-surface:#15181e;--bg-elevated:#1e222b;--text-primary:#e6e6f0;--text-secondary:#a0a0b0;--text-muted:#6c7078;--border-subtle:#2a2f3a;--border-default:#3a3f4a;--border-focus:#3a78f0;--primary:#3a78f0;--primary-hover:#2a68e0;--primary-bg:#1a2540;--danger:#cf6679;--danger-hover:#b35063;--danger-bg:#3a2028;--secondary:#546e7a;--secondary-hover:#455a64;--success:#66bb6a;--success-bg:#1a3528;--warning:#ffa726;--warning-bg:#3a321a;--shadow-sm:0 1px 2px rgba(0,0,0,0.4);--shadow-md:0 2px 8px rgba(0,0,0,0.5);--shadow-lg:0 4px 20px rgba(0,0,0,0.6);--radius-sm:4px;--radius-md:6px;--radius-lg:8px;--focus-ring:0 0 0 3px rgba(58,120,240,0.25);--file-input-bg:#1e222b;--file-input-border:#3a3f4a;--status-exists:#66bb6a;--status-pending:#3a78f0;--status-missing:#6c7078;--transition-fast:150ms ease;--transition-normal:250ms ease;--invisible-opacity:0.4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg-page);color:var(--text-primary);line-height:1.5;font-size:14px;user-select:none}
.container{max-width:1440px;margin:0 auto;padding:24px}
header{background:var(--bg-surface);border-bottom:1px solid var(--border-default);padding:16px 24px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:1.25rem;font-weight:600;letter-spacing:-0.02em;color:var(--text-primary)}
.header-controls{display:flex;gap:12px;flex-wrap:wrap}
.theme-toggle,.lang-toggle,.logout-toggle,.secret-toggle{background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:8px 16px;cursor:pointer;font-size:0.875rem;font-weight:500;transition:all var(--transition-fast);display:flex;align-items:center;gap:6px}
.theme-toggle:hover,.lang-toggle:hover,.logout-toggle:hover,.secret-toggle:hover{background:var(--bg-elevated);border-color:var(--border-focus)}
.theme-toggle:focus,.lang-toggle:focus,.logout-toggle:focus,.secret-toggle:focus{outline:none;box-shadow:var(--focus-ring)}
.logout-toggle{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.logout-toggle:hover{background:var(--danger);color:#fff;border-color:var(--danger-hover)}
.secret-toggle{background:var(--primary-bg);color:var(--primary);border-color:var(--primary)}
.secret-toggle:hover{background:var(--primary);color:#fff;border-color:var(--primary-hover)}
.theme-icon{font-size:1.2rem;transition:transform 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);display:inline-block;transform:rotate(270deg)}
[data-theme="dark"] .theme-icon{transform:rotate(90deg)}
.blocks-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;padding:4px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:6px;inline-size:fit-content;position:relative;overflow:hidden}
.block-btn{padding:10px 20px;background:transparent;border:none;border-radius:var(--radius-md);cursor:pointer;font-size:0.9rem;font-weight:500;color:var(--text-secondary);transition:color var(--transition-fast);white-space:nowrap;position:relative}
.block-btn.active{color:var(--primary)}
.nav-indicator{position:absolute;bottom:6px;left:0;height:2px;background:var(--primary);transition:transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1), width 0.3s ease;pointer-events:none;border-radius:2px}
.panel{background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:24px;border:1px solid var(--border-default);position:relative;overflow:hidden}
.panel.is-loading .panel-content{opacity:0;transform:translateY(8px);pointer-events:none}
.panel-content{transition:opacity var(--transition-normal),transform var(--transition-normal)}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border-subtle);flex-wrap:wrap;gap:12px}
.panel-title{font-size:1.1rem;font-weight:600;color:var(--text-primary);letter-spacing:-0.01em;transition:opacity var(--transition-fast)}
.btn{padding:10px 24px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);cursor:pointer;font-size:0.9rem;font-weight:500;transition:background var(--transition-fast);min-width:110px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,0.3);border-radius:50%;transform:translate(-50%,-50%);transition:width 600ms ease-out,height 600ms ease-out,opacity 600ms ease-out}
.btn:active::before{width:300px;height:300px;opacity:0}
.btn:hover{background:var(--primary-hover)}
.btn:focus{outline:none;box-shadow:var(--focus-ring)}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.btn-danger{background:var(--danger)}
.btn-danger:hover{background:var(--danger-hover)}
.btn-secondary{background:var(--secondary);color:#fff}
.btn-secondary:hover{background:var(--secondary-hover)}
.btn-sm{padding:6px 16px;font-size:0.85rem;min-width:80px}
.items-list{display:flex;flex-direction:column;gap:8px;min-height:120px;transition:opacity var(--transition-normal)}
.items-list.fade-out{opacity:0}
.items-list.fade-in{animation:fadeIn var(--transition-normal) forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.item-card{border:1px solid var(--border-default);border-radius:var(--radius-md);padding:16px 20px;background:var(--bg-surface);cursor:pointer;transition:box-shadow var(--transition-fast),border-color var(--transition-fast),transform var(--transition-fast),opacity var(--transition-fast);display:flex;align-items:center;justify-content:space-between;min-height:64px}
.item-card.dragging{opacity:0.3;box-shadow:var(--shadow-lg);border-color:var(--primary)}
.item-card.drag-over{border-color:var(--primary);background:var(--primary-bg)}
.item-card.invisible{opacity:var(--invisible-opacity);border-style:dashed;background:var(--bg-elevated)}
.item-card.invisible:hover{opacity:calc(var(--invisible-opacity) + 0.1)}
.item-card-content{display:flex;align-items:center;gap:12px;flex:1}
.item-title{font-weight:500;color:var(--text-primary);font-size:0.95rem}
.visibility-badge{display:inline-flex;align-items:center;gap:4px;font-size:0.7rem;font-weight:600;padding:2px 8px;border-radius:12px;text-transform:uppercase;letter-spacing:0.03em}
.visibility-badge.visible{background:var(--success-bg);color:var(--success)}
.visibility-badge.invisible{background:var(--bg-elevated);color:var(--text-muted)}
.section-divider{display:flex;align-items:center;gap:12px;margin:20px 0 12px;padding:8px 0;border-bottom:1px solid var(--border-subtle)}
.section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:var(--border-subtle)}
.section-title{font-size:0.75rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap}
.form-group{margin-bottom:20px}
.form-label{display:block;margin-bottom:6px;font-weight:500;font-size:0.875rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.03em}
.form-input,.form-textarea,.form-select{width:100%;padding:10px 12px;border:1px solid var(--border-default);border-radius:var(--radius-md);font-size:0.95rem;background:var(--bg-surface);color:var(--text-primary);transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.form-textarea{min-height:96px;resize:both;font-family:inherit}
.form-input{min-height:40px;resize:both;overflow:auto;font-family:inherit}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--border-focus);box-shadow:var(--focus-ring)}
input[type="date"]::-webkit-calendar-picker-indicator,input[type="time"]::-webkit-calendar-picker-indicator,input[type="datetime-local"]::-webkit-calendar-picker-indicator{opacity:1;cursor:pointer;filter:var(--calendar-filter,none);transition:transform var(--transition-fast)}
input[type="date"]::-webkit-calendar-picker-indicator:hover,input[type="time"]::-webkit-calendar-picker-indicator:hover,input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover{transform:scale(1.1)}
:root[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator,:root[data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator,:root[data-theme="dark"] input[type="datetime-local"]::-webkit-calendar-picker-indicator{filter:invert(1) brightness(1.1)}
.file-input-wrapper{position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--file-input-bg);border:1px solid var(--file-input-border);border-radius:var(--radius-md);cursor:pointer;transition:border-color var(--transition-fast),background var(--transition-fast)}
.file-input-wrapper:hover{border-color:var(--border-focus);background:var(--bg-elevated)}
.file-input-wrapper.has-file{border-color:var(--primary);background:var(--primary-bg)}
.file-input-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:1rem;transition:transform var(--transition-fast)}
.file-input-wrapper:hover .file-input-icon{transform:scale(1.1)}
.file-input-text{flex:1;font-size:0.9rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color var(--transition-fast)}
.file-input-wrapper.has-file .file-input-text{color:var(--text-primary);font-weight:500}
.file-input-btn{padding:6px 14px;background:var(--secondary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:0.85rem;cursor:pointer;transition:background var(--transition-fast);white-space:nowrap;font-weight:500}
.file-input-btn:hover{background:var(--secondary-hover)}
.file-input-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.file-input-remove{padding:4px 8px;background:var(--danger);color:#fff;border:none;border-radius:var(--radius-sm);font-size:0.75rem;cursor:pointer;transition:background var(--transition-fast),transform var(--transition-fast);display:none;font-weight:500}
.file-input-wrapper.has-file .file-input-remove{display:inline-block}
.file-input-remove:hover{background:var(--danger-hover);transform:scale(1.05)}
.attachments-section{margin-top:20px;padding-top:20px;border-top:1px solid var(--border-subtle);transition:opacity var(--transition-normal)}
.attachment-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-md);margin-bottom:8px;transition:background var(--transition-fast),border-color var(--transition-fast),transform var(--transition-fast)}
.attachment-item:hover{transform:translateX(2px)}
.attachment-item.no-file{opacity:0.7;background:var(--bg-surface)}
.attachment-item.pending{border-color:var(--primary);background:var(--primary-bg)}
.attachment-info{flex:1;display:flex;flex-direction:column;gap:4px}
.attachment-name{font-size:0.9rem;color:var(--text-primary);font-weight:500}
.attachment-meta{font-size:0.8rem;color:var(--text-muted)}
.attachment-status{display:inline-flex;align-items:center;gap:4px;font-size:0.75rem;font-weight:600;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.03em;transition:background var(--transition-fast),color var(--transition-fast)}
.attachment-status.exists{background:var(--success-bg);color:var(--success)}
.attachment-status.missing{background:var(--bg-elevated);color:var(--status-missing)}
.attachment-status.pending{background:var(--primary-bg);color:var(--status-pending)}
.attachment-actions{display:flex;gap:6px;flex-shrink:0}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:opacity var(--transition-normal)}
.modal.active{display:flex}
.modal-content{background:var(--bg-surface);border-radius:var(--radius-lg);max-width:640px;width:95%;max-height:90vh;overflow-y:auto;padding:24px;border:1px solid var(--border-default);box-shadow:var(--shadow-lg);transform:translateY(16px);opacity:0;transition:transform var(--transition-normal),opacity var(--transition-normal)}
.modal.active .modal-content{transform:translateY(0);opacity:1}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border-subtle)}
.modal-title{font-size:1.1rem;font-weight:600;color:var(--text-primary)}
.modal-close{background:none;border:none;font-size:1.75rem;cursor:pointer;color:var(--text-muted);line-height:1;padding:4px;border-radius:var(--radius-sm);transition:background var(--transition-fast),color var(--transition-fast),transform var(--transition-fast)}
.modal-close:hover{background:var(--bg-elevated);color:var(--text-primary);transform:rotate(90deg)}
.form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid var(--border-subtle);flex-wrap:wrap}
.hidden{display:none}
.error-msg{color:var(--danger);font-size:0.85rem;margin-top:4px;font-weight:500}
.success-msg{color:var(--success);font-size:0.85rem;margin-top:4px;font-weight:500}
.loading{opacity:0.6;pointer-events:none}
.tags-input{display:flex;gap:6px;flex-wrap:wrap;min-height:38px;padding:4px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--bg-surface);transition:border-color var(--transition-fast)}
.tags-input:focus-within{border-color:var(--border-focus)}
.tag{background:var(--primary-bg);color:var(--primary);padding:4px 12px;border-radius:20px;font-size:0.8rem;display:flex;align-items:center;gap:6px;font-weight:500;border:1px solid var(--border-subtle)}
.tag-remove{cursor:pointer;font-weight:700;font-size:1rem;line-height:1;opacity:0.7;transition:opacity var(--transition-fast),transform var(--transition-fast)}
.tag-remove:hover{opacity:1;transform:scale(1.2)}
.tag-input-wrapper{display:flex;gap:8px;margin-top:8px;width:100%}
.tag-input{flex:1;padding:8px 12px;border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:0.9rem;background:var(--bg-surface);color:var(--text-primary);transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.tag-input:focus{outline:none;border-color:var(--border-focus);box-shadow:var(--focus-ring)}
.empty-state{text-align:center;color:var(--text-muted);padding:48px 24px;font-size:0.95rem;background:var(--bg-elevated);border-radius:var(--radius-lg);border:1px dashed var(--border-default)}
.drag-hint{font-size:0.8rem;color:var(--text-muted);margin-top:12px;text-align:center;font-weight:500;letter-spacing:0.02em;transition:opacity var(--transition-fast)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;font-size:0.75rem;font-weight:600;border-radius:12px;background:var(--bg-elevated);color:var(--text-secondary);border:1px solid var(--border-subtle);transition:background var(--transition-fast)}
.badge:hover{background:var(--bg-surface)}
.divider{height:1px;background:var(--border-subtle);margin:16px 0}
.context-menu{position:fixed;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:4px;z-index:2000;min-width:140px;display:none;animation:contextFade 0.15s ease}
.context-menu.active{display:block}
.context-menu-item{padding:8px 16px;cursor:pointer;border-radius:var(--radius-sm);font-size:0.875rem;display:flex;align-items:center;gap:8px;transition:background var(--transition-fast)}
.context-menu-item:hover{background:var(--bg-elevated)}
.context-menu-item.danger{color:var(--danger)}
.context-menu-item.danger:hover{background:var(--danger-bg)}
@keyframes contextFade{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-page)}
::-webkit-scrollbar-thumb{background:var(--secondary);border-radius:4px;transition:background var(--transition-fast)}
::-webkit-scrollbar-thumb:hover{background:var(--secondary-hover)}
@media(max-width:768px){.panel-header{flex-direction:column;align-items:flex-start}.item-card{flex-direction:column;align-items:flex-start;gap:12px}.form-actions{flex-direction:column}.btn{width:100%}.header-controls{width:100%;justify-content:space-between}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.text-truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-flex{display:flex}
.gap-8{gap:8px}
.align-center{align-items:center}
.justify-end{justify-content:flex-end}
.mt-16{margin-top:16px}
.mb-8{margin-bottom:8px}
.fw-500{font-weight:500}
.text-muted{color:var(--text-muted)}
.text-primary{color:var(--text-primary)}
.drag-indicator{position:fixed;width:24px;height:24px;background:var(--primary);border-radius:50%;pointer-events:none;z-index:3000;opacity:0.6;box-shadow:0 0 0 4px var(--primary-bg);display:none}
.drag-indicator.active{display:block;animation:pulse 0.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.6}50%{transform:scale(1.2);opacity:0.8}}
.item-preview{position:fixed;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:16px;max-width:400px;z-index:3000;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity var(--transition-fast),transform var(--transition-fast);display:none}
.item-preview.active{display:block;opacity:1;transform:translateY(0)}
.item-preview-title{font-weight:600;font-size:1rem;color:var(--text-primary);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-subtle)}
.item-preview-content{font-size:0.875rem;color:var(--text-secondary);max-height:300px;overflow-y:auto}
.item-preview-field{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border-subtle)}
.item-preview-field:last-child{border-bottom:none}
.item-preview-label{font-weight:500;color:var(--text-muted);text-transform:uppercase;font-size:0.75rem;letter-spacing:0.03em}
.item-preview-value{color:var(--text-primary);text-align:right;max-width:60%;word-break:break-word}
.item-card.dragging .item-preview,.item-card.drag-over .item-preview{display:none!important}
input[type="text"],input[type="password"],textarea{resize:both!important;overflow:auto!important;min-height:40px}
</style>
</head>
<body>
<div class="container">
<header>
<h1 id="headerTitle">Панель управления</h1>
<div class="header-controls">
<button class="secret-toggle" id="changeSecretBtn" title="Сменить ключ доступа"><span>🔑</span><span id="changeSecretText">Сменить ключ</span></button>
<button class="logout-toggle" id="logoutBtn" title="Выйти из системы"><span>🚪</span><span id="logoutText">Выйти</span></button>
<button class="lang-toggle" id="langToggle"><span>EN</span></button>
<button class="theme-toggle" id="themeToggle"><span class="theme-icon">🌓</span><span id="themeLabel">Тёмная тема</span></button>
</div>
</header>
<nav class="blocks-nav" id="blocksNav" aria-label="Блоки контента">
<div class="nav-indicator" id="navIndicator"></div>
</nav>
<section class="panel" id="contentPanel" aria-labelledby="panelTitle">
<div class="panel-content">
<div class="panel-header">
<h2 class="panel-title" id="panelTitle">Выберите блок</h2>
<button class="btn" id="createBtn" disabled data-i18n="create"><span>+</span> Создать</button>
</div>
<div class="items-list" id="itemsList" role="list"></div>
<div class="drag-hint" id="dragHint" data-i18n="dragHint">Клик — редактирование, долгое нажатие — перетаскивание (только видимые), ПКМ — меню</div>
</div>
</section>
</div>

<div class="modal" id="secretModal" role="dialog" aria-modal="true">
<div class="modal-content" style="max-width: 480px;">
<div class="modal-header">
<h3 class="modal-title" id="secretModalTitle">Смена ключа доступа</h3>
<button class="modal-close" id="secretModalClose" aria-label="Закрыть">&times;</button>
</div>
<form id="secretForm" novalidate>
<!-- Текущий ключ не показываем пользователю, но передаем в скрипте -->
<div class="form-group">
<label class="form-label" for="newSecret" id="newSecretLabel">НОВЫЙ КЛЮЧ</label>
<input type="password" class="form-input" id="newSecret" required autocomplete="off" minlength="6">
</div>
<div class="form-group">
<label class="form-label" for="confirmSecret" id="confirmSecretLabel">ПОДТВЕРДИТЕ НОВЫЙ КЛЮЧ</label>
<input type="password" class="form-input" id="confirmSecret" required autocomplete="off">
</div>
<div class="error-msg" id="secretErrorMsg" style="display: none;">
<span class="error-icon">⚠</span>

function t(key, params = {}) {
const lang = translations[currentLang];
let result = key.split('.').reduce((obj, k) => obj?.[k], lang);
if (result && typeof result === 'string') {
Object.entries(params).forEach(([k, v]) => {
result = result.replace(`{${k}}`, v);
});
}
return result || key;
}

function getSecretFromUrl() {
const urlParams = new URLSearchParams(window.location.search);
const urlSecret = urlParams.get('secret');
if (urlSecret && urlSecret.trim()) {
return urlSecret.trim();
}
return null;
}

function initSecret() {
const urlSecret = getSecretFromUrl();
if (urlSecret) {
SECRET = urlSecret;
localStorage.setItem('api_secret', SECRET);
const url = new URL(window.location);
url.searchParams.delete('secret');
window.history.replaceState({}, document.title, url.toString());
} else {
const savedSecret = localStorage.getItem('api_secret');
if (savedSecret) {
SECRET = savedSecret;
}
}
}

function logout() {
if (confirm(t('logoutConfirm'))) {
localStorage.removeItem('api_secret');
document.cookie = "admin_secret=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
window.location.href = '/';
}
}

function showSecretError(message) {
const errorMsg = document.getElementById('secretErrorMsg');
const errorText = document.getElementById('secretErrorText');
errorText.textContent = message;
errorMsg.style.display = 'flex';
setTimeout(() => {
errorMsg.style.display = 'none';
}, 3000);
}

function hideSecretError() {
document.getElementById('secretErrorMsg').style.display = 'none';
}

async function changeSecret(newSecret) {
try {
const formData = new FormData();
formData.append('secret', SECRET);
formData.append('new', newSecret);

const response = await fetch(`${API_BASE}/secret`, {
method: 'POST',
body: formData
});

const result = await response.json();

if (result.status === 'ok') {
alert(t('secretChangeSuccess'));
localStorage.removeItem('api_secret');
document.cookie = "admin_secret=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
window.location.href = '/';
} else {
showSecretError(t('secretChangeError'));
}
} catch (error) {
showSecretError(t('secretChangeError'));
}
}

document.documentElement.lang = currentLang;
document.getElementById('headerTitle').textContent = t('headerTitle');
document.getElementById('themeLabel').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? t('lightTheme') : t('darkTheme');
document.getElementById('langToggle').querySelector('span').textContent = currentLang === 'ru' ? 'EN' : 'RU';
document.getElementById('logoutText').textContent = t('logout');
document.getElementById('changeSecretText').textContent = t('changeSecret');
document.getElementById('secretModalTitle').textContent = t('changeSecretTitle');
document.getElementById('newSecretLabel').textContent = t('newSecret');
document.getElementById('confirmSecretLabel').textContent = t('confirmSecret');
document.getElementById('secretCancelBtn').textContent = t('cancel');
document.getElementById('secretSubmitBtn').textContent = t('changeSecret');
document.getElementById('createModalTitle').textContent = t('createTitle');
document.getElementById('createNameLabel').textContent = t('itemNameLabel');
document.getElementById('createName').placeholder = t('itemNamePlaceholder');
document.getElementById('createCancelBtn').textContent = t('cancel');
document.getElementById('cancelBtn').textContent = t('cancel');
document.getElementById('ctxHideText').textContent = t('hide');
document.getElementById('ctxDeleteText').textContent = t('delete');

if (!currentBlock) {
document.getElementById('panelTitle').textContent = t('selectBlock');
} else {
document.getElementById('panelTitle').textContent = currentBlock.charAt(0).toUpperCase() + currentBlock.slice(1);
}
document.getElementById('dragHint').textContent = t('dragHint');

document.querySelectorAll('.section-title').forEach(el => {
if (el.textContent === 'Видимые' || el.textContent === 'Visible' || el.textContent === 'visible' || el.textContent === 'invisible') {
el.textContent = t(el.textContent.toLowerCase() === 'visible' ? 'visible' : 'invisible');
}
});
}

function initTheme() {
const saved = localStorage.getItem('theme');
const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.setAttribute('data-theme', theme);
updateThemeToggle();
}

function toggleTheme() {
const current = document.documentElement.getAttribute('data-theme');
const next = current === 'dark' ? 'light' : 'dark';
document.documentElement.setAttribute('data-theme', next);
localStorage.setItem('theme', next);
updateThemeToggle();
applyTranslations();
}

function updateThemeToggle() {
document.getElementById('themeLabel').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? t('lightTheme') : t('darkTheme');
}

function toggleLang() {
currentLang = currentLang === 'ru' ? 'en' : 'ru';
localStorage.setItem('lang', currentLang);
applyTranslations();
if (blockRequires) {
generateFormFields();
const itemName = document.getElementById('itemName').value;
if (itemName) {
generateAttachmentsSection(itemName);
if (document.getElementById('itemModal').classList.contains('active')) {
loadItemData(itemName);
}
}
}
renderItemsList();
}

async function fetchBlocks() {
try {
const res = await fetch(`${API_BASE}/list?secret=${encodeURIComponent(SECRET)}`);
if (!res.ok) throw new Error('HTTP ' + res.status);
const blocks = await res.json();
renderBlocksNav(blocks);
if (blocks && blocks.length > 0) {
const firstBtn = document.getElementById('blocksNav').querySelector('.block-btn');
if (firstBtn) {
selectBlock(blocks[0], firstBtn);
}
}
} catch (e) {
document.getElementById('blocksNav').innerHTML = '<div style="color:var(--danger);padding:12px">' + t('error.loadBlocks') + '</div>';
}
}

function renderBlocksNav(blocks) {
const nav = document.getElementById('blocksNav');
nav.innerHTML = '<div class="nav-indicator" id="navIndicator"></div>';
if (!blocks || blocks.length === 0) {
nav.innerHTML += '<div style="color:var(--text-muted);padding:12px">' + t('emptyState') + '</div>';
return;
}
blocks.forEach(block => {
const btn = document.createElement('button');
btn.className = 'block-btn';
btn.type = 'button';
btn.textContent = block;
btn.setAttribute('aria-pressed', 'false');
btn.onclick = function() { selectBlock(block, this); };
nav.appendChild(btn);
});
}

function updateIndicator(btn) {
const indicator = document.getElementById('navIndicator');
if (!indicator || !btn) return;
indicator.style.width = `${btn.offsetWidth}px`;
indicator.style.transform = `translateX(${btn.offsetLeft}px)`;
}

async function selectBlock(block, btnElement) {
if (isTransitioning) return;
await startTransition();
currentBlock = block;
document.querySelectorAll('.block-btn').forEach(b => {
b.classList.remove('active');
b.setAttribute('aria-pressed', 'false');
});
if (btnElement) {
btnElement.classList.add('active');
btnElement.setAttribute('aria-pressed', 'true');
updateIndicator(btnElement);
}
document.getElementById('panelTitle').textContent = block.charAt(0).toUpperCase() + block.slice(1);
document.getElementById('createBtn').disabled = false;
document.getElementById('createBlock').value = block;
try {
const res = await fetch(`${API_BASE}/${block}/requires?secret=${encodeURIComponent(SECRET)}`);
if (!res.ok) throw new Error('HTTP ' + res.status);
blockRequires = await res.json();
await loadItems();
} catch (e) {}
endTransition();
}

async function loadItems() {
if (!currentBlock) return;
try {
const res = await fetch(`${API_BASE}/${currentBlock}/list?secret=${encodeURIComponent(SECRET)}`, {
headers: {'Cache-Control': 'no-cache'}
});
if (!res.ok) throw new Error('HTTP ' + res.status);
const data = await res.json();
visibleItems = data.visible || [];
invisibleItems = data.invisible || [];
renderItemsList();
} catch (e) {}
}

function renderItemsList() {
const list = document.getElementById('itemsList');
list.innerHTML = '';
const hasVisible = visibleItems.length > 0;
const hasInvisible = invisibleItems.length > 0;
if (!hasVisible && !hasInvisible) {
list.innerHTML = `<div class="empty-state">${t('emptyState')}</div>`;
document.getElementById('dragHint').style.display = 'none';
return;
}
document.getElementById('dragHint').style.display = 'block';
if (hasVisible) {
const visibleSection = document.createElement('div');
const divider = document.createElement('div');
divider.className = 'section-divider';
divider.innerHTML = `<span class="section-title">${t('visible')}</span>`;
list.appendChild(divider);
visibleItems.forEach((name, index) => {
const card = createItemCard(name, index, false);
visibleSection.appendChild(card);
});
list.appendChild(visibleSection);
}
if (hasInvisible) {
const invisibleSection = document.createElement('div');
const divider = document.createElement('div');
divider.className = 'section-divider';
divider.innerHTML = `<span class="section-title">${t('invisible')}</span>`;
list.appendChild(divider);
invisibleItems.forEach((name, index) => {
const card = createItemCard(name, index, true);
invisibleSection.appendChild(card);
});
list.appendChild(invisibleSection);
}
}

function createItemCard(name, index, isInvisible) {
const card = document.createElement('div');
card.className = 'item-card' + (isInvisible ? ' invisible' : '');
card.dataset.name = name;
card.setAttribute('role', 'listitem');
card.addEventListener('mousedown', handleMouseDown);
card.addEventListener('mouseenter', (e) => { showPreview(e, name); });
card.addEventListener('mouseleave', () => { hidePreview(); });
card.addEventListener('mousemove', (e) => { movePreview(e); });
card.addEventListener('contextmenu', (e) => handleContextMenu(e, name, isInvisible));
card.addEventListener('click', (e) => {
if (!longPressActive && Date.now() - clickStartTime < 200) {
hidePreview();
openEditModal(name);
}
});
const content = document.createElement('div');
content.className = 'item-card-content';
const title = document.createElement('div');
title.className = 'item-title text-truncate';
title.textContent = name;
title.title = name;
const badge = document.createElement('span');
badge.className = 'visibility-badge ' + (isInvisible ? 'invisible' : 'visible');
badge.textContent = isInvisible ? t('invisible') : t('visible');
content.appendChild(title);
content.appendChild(badge);
card.appendChild(content);
return card;
}

function handleMouseDown(e) {
if (e.button !== 0) return;
const card = this;
const isInvisible = card.classList.contains('invisible');
clickStartTime = Date.now();
longPressActive = false;
dragStartPos = {x: e.clientX, y: e.clientY};
hidePreview();
clearTimeout(longPressTimer);
isMouseDown = true;
const clearDrag = () => {
isMouseDown = false;
clearTimeout(longPressTimer);
document.removeEventListener('mouseup', clearDrag);
};
document.addEventListener('mouseup', clearDrag);
if (!isInvisible) {
longPressTimer = setTimeout(() => {
if (!isMouseDown) return;
longPressActive = true;
draggedItem = card;
card.classList.add('dragging');
const indicator = document.getElementById('dragIndicator');
indicator.style.left = (e.clientX - 12) + 'px';
indicator.style.top = (e.clientY - 12) + 'px';
indicator.classList.add('active');
document.addEventListener('mousemove', handleDragMove);
document.addEventListener('mouseup', handleDragEnd);
}, DRAG_DELAY);
}
}

function handleDragMove(e) {
if (!longPressActive || !draggedItem) return;
const indicator = document.getElementById('dragIndicator');
indicator.style.left = (e.clientX - 12) + 'px';
indicator.style.top = (e.clientY - 12) + 'px';
highlightDropTarget(e);
}

function highlightDropTarget(e) {
const list = document.getElementById('itemsList');
const cards = Array.from(list.querySelectorAll('.item-card:not(.invisible)'));
let target = null;
for (const card of cards) {
const rect = card.getBoundingClientRect();
if (e.clientY >= rect.top && e.clientY <= rect.bottom) {
target = card;
break;
}
}
cards.forEach(c => c.classList.remove('drag-over'));
if (target && target !== draggedItem) {
target.classList.add('drag-over');
}
}

function handleDragEnd(e) {
clearTimeout(longPressTimer);
document.removeEventListener('mousemove', handleDragMove);
document.removeEventListener('mouseup', handleDragEnd);
if (longPressActive && draggedItem) {
const list = document.getElementById('itemsList');
const cards = Array.from(list.querySelectorAll('.item-card:not(.invisible)'));
const dropTarget = cards.find(c => c.classList.contains('drag-over'));
if (dropTarget && dropTarget !== draggedItem) {
const draggedIndex = cards.indexOf(draggedItem);
const targetIndex = cards.indexOf(dropTarget);
if (draggedIndex < targetIndex) {
dropTarget.parentNode.insertBefore(draggedItem, dropTarget.nextSibling);
} else {
dropTarget.parentNode.insertBefore(draggedItem, dropTarget);
}
updateVisibleOrder();
}
draggedItem.classList.remove('dragging');
cards.forEach(c => c.classList.remove('drag-over'));
saveOrder();
}
hideDragIndicator();
}

function updateVisibleOrder() {
const list = document.getElementById('itemsList');
visibleItems = Array.from(list.querySelectorAll('.item-card:not(.invisible)')).map(card => card.dataset.name);
}

async function saveOrder() {
if (!currentBlock) return;
try {
const formData = new FormData();
formData.append('data', JSON.stringify(visibleItems));
formData.append('secret', SECRET);
const res = await fetch(`${API_BASE}/${currentBlock}/list`, {
method: 'POST',
body: formData
});
const result = await res.json();
if (result.status !== 'ok') await loadItems();
} catch (e) {
await loadItems();
}
}

function handleContextMenu(e, name, isInvisible) {
e.preventDefault();
e.stopPropagation();
hideDragIndicator();
hidePreview();
contextTarget = {name, isInvisible};
const menu = document.getElementById('contextMenu');
document.getElementById('ctxHideText').textContent = isInvisible ? t('show') : t('hide');
menu.style.left = `${e.pageX}px`;
menu.style.top = `${e.pageY}px`;
menu.classList.add('active');
}

function hideContextMenu() {
document.getElementById('contextMenu').classList.remove('active');
contextTarget = null;
}

async function toggleVisibility(name, isInvisible) {
try {
let order = [...visibleItems];
if (isInvisible) {
order.push(name);
} else {
order = order.filter(item => item !== name);
}
const formData = new FormData();
formData.append('data', JSON.stringify(order));
formData.append('secret', SECRET);
const res = await fetch(`${API_BASE}/${currentBlock}/list`, {
method: 'POST',
body: formData
});
const result = await res.json();
if (result.status === 'ok') {
await loadItems();
}
} catch (e) {}
}

async function deleteItem(itemName) {
if (!confirm(t('deleteConfirm', {name: itemName}))) return;
try {
const formData = new FormData();
formData.append('name', itemName);
formData.append('secret', SECRET);
const res = await fetch(`${API_BASE}/${currentBlock}/remove`, {
method: 'POST',
body: formData
});
const result = await res.json();
if (result.status === 'ok') await loadItems();
} catch (e) {}
}

function hideDragIndicator() {
clearTimeout(longPressTimer);
document.getElementById('dragIndicator').classList.remove('active');
document.removeEventListener('mousemove', handleDragMove);
document.removeEventListener('mouseup', handleDragEnd);
draggedItem = null;
longPressActive = false;
}

function hidePreview() {
clearTimeout(previewTimer);
previewTarget = null;
const preview = document.getElementById('itemPreview');
preview.classList.remove('active');
}

function movePreview(e) {
currentMousePos = {x: e.clientX, y: e.clientY};
const preview = document.getElementById('itemPreview');
if (preview.classList.contains('active')) {
preview.style.left = (currentMousePos.x + 15) + 'px';
preview.style.top = (currentMousePos.y + 15) + 'px';
}
}

async function showPreview(e, name) {
if (longPressActive || draggedItem || isTransitioning) return;
previewTarget = name;
currentMousePos = {x: e.clientX, y: e.clientY};
clearTimeout(previewTimer);
previewTimer = setTimeout(async () => {
if (longPressActive || draggedItem || !previewTarget) return;
const preview = document.getElementById('itemPreview');
try {
const res = await fetch(`${API_BASE}/${currentBlock}/content?name=${encodeURIComponent(previewTarget)}&secret=${encodeURIComponent(SECRET)}`, {
headers: {'Cache-Control': 'no-cache'}
});
if (res.status === 404) return;
const data = await res.json();
let html = `<div class="item-preview-title">${previewTarget}</div><div class="item-preview-content">`;
if (blockRequires && blockRequires.json) {
blockRequires.json.forEach(([sysname, ftype, displayname]) => {
if (data[sysname] !== undefined && data[sysname] !== null && data[sysname] !== '') {
html += `<div class="item-preview-field"><span class="item-preview-label">${displayname}</span><span class="item-preview-value">${data[sysname]}</span></div>`;
}
});
}
html += '</div>';
preview.innerHTML = html;
preview.style.left = (currentMousePos.x + 15) + 'px';
preview.style.top = (currentMousePos.y + 15) + 'px';
preview.classList.add('active');
} catch (err) {}
}, 500);
}

function startTransition() {
if (isTransitioning) return Promise.reject();
isTransitioning = true;
const panel = document.getElementById('contentPanel');
const itemsList = document.getElementById('itemsList');
const panelTitle = document.getElementById('panelTitle');
const createBtn = document.getElementById('createBtn');
panel.classList.add('is-loading');
itemsList.classList.add('fade-out');
panelTitle.style.opacity = '0';
createBtn.disabled = true;
return new Promise(resolve => setTimeout(resolve, 250));
}

function endTransition() {
const panel = document.getElementById('contentPanel');
const itemsList = document.getElementById('itemsList');
const panelTitle = document.getElementById('panelTitle');
const createBtn = document.getElementById('createBtn');
panel.classList.remove('is-loading');
itemsList.classList.remove('fade-out');
itemsList.classList.add('fade-in');
panelTitle.style.opacity = '1';
createBtn.disabled = !currentBlock;
setTimeout(() => {
itemsList.classList.remove('fade-in');
isTransitioning = false;
}, 250);
}

function generateFormFields() {
const container = document.getElementById('formFields');
container.innerHTML = '';
if (!blockRequires || !blockRequires.json) return;
blockRequires.json.forEach(([sysname, ftype, displayname]) => {
const group = document.createElement('div');
group.className = 'form-group';
const label = document.createElement('label');
label.className = 'form-label';
label.textContent = displayname.toUpperCase();
label.htmlFor = `field_${sysname}`;
let input;
if (ftype === 'bool') {
input = document.createElement('select');
input.className = 'form-select';
input.id = `field_${sysname}`;
input.innerHTML = `<option value="">${t('notSet')}</option><option value="true">${t('yes')}</option><option value="false">${t('no')}</option>`;
} else if (ftype === 'list') {
input = document.createElement('div');
input.className = 'tags-input';
input.id = `field_${sysname}`;
const wrapper = document.createElement('div');
wrapper.className = 'tag-input-wrapper';
const tagInput = document.createElement('input');
tagInput.className = 'tag-input';
tagInput.type = 'text';
tagInput.placeholder = t('addTag');
tagInput.onkeydown = (e) => {
if (e.key === 'Enter' && tagInput.value.trim()) {
e.preventDefault();
addTag(input, tagInput.value.trim());
tagInput.value = '';
}
};
const addBtn = document.createElement('button');
addBtn.type = 'button';
addBtn.className = 'btn btn-sm btn-secondary';
addBtn.textContent = t('add');
addBtn.onclick = () => {
if (tagInput.value.trim()) {
addTag(input, tagInput.value.trim());
tagInput.value = '';
}
};
wrapper.appendChild(tagInput);
wrapper.appendChild(addBtn);
group.appendChild(label);
group.appendChild(input);
group.appendChild(wrapper);
container.appendChild(group);
return;
} else if (['date', 'time', 'date-time'].includes(ftype)) {
input = document.createElement('input');
input.className = 'form-input';
input.type = ftype === 'date' ? 'date' : ftype === 'time' ? 'time' : 'datetime-local';
input.id = `field_${sysname}`;
} else if (['int', 'float'].includes(ftype)) {
input = document.createElement('input');
input.className = 'form-input';
input.type = 'number';
input.step = ftype === 'float' ? 'any' : '1';
input.id = `field_${sysname}`;
} else {
input = document.createElement('textarea');
input.className = 'form-textarea';
input.id = `field_${sysname}`;
}
group.appendChild(label);
group.appendChild(input);
container.appendChild(group);
});
}

function addTag(container, value) {
const tag = document.createElement('span');
tag.className = 'tag';
tag.innerHTML = `${value}<span class="tag-remove" aria-label="Удалить тег">&times;</span>`;
tag.querySelector('.tag-remove').onclick = () => tag.remove();
container.insertBefore(tag, container.lastElementChild);
}

function attachmentExists(sysname) {
return existingAttachments.includes(sysname);
}

function attachmentPending(sysname) {
return pendingAttachments[sysname] !== undefined;
}

function getExtensionFromMime(mime) {
const mapping = {
'text/plain': '.txt', 'text/html': '.html', 'text/css': '.css',
'image/jpeg': '.jpg', 'image/png': '.png', 'image/gif': '.gif',
'image/webp': '.webp', 'image/svg+xml': '.svg', 'application/pdf': '.pdf',
'application/json': '.json', 'video/mp4': '.mp4', 'audio/mpeg': '.mp3'
};
return mapping[mime] || '.bin';
}

function generateAttachmentsSection(itemName) {
const section = document.getElementById('attachmentsSection');
section.innerHTML = '';
if (!blockRequires || !blockRequires.attachments || !blockRequires.attachments.length) {
section.classList.add('hidden');
return;
}
section.classList.remove('hidden');
const title = document.createElement('div');
title.style.fontWeight = '600';
title.style.marginBottom = '12px';
title.style.textTransform = 'uppercase';
title.style.letterSpacing = '0.03em';
title.style.fontSize = '0.8rem';
title.style.color = 'var(--text-secondary)';
title.textContent = t('attachments');
section.appendChild(title);
blockRequires.attachments.forEach(([sysname, mime, displayname]) => {
const exists = attachmentExists(sysname);
const pending = attachmentPending(sysname);
const item = document.createElement('div');
item.className = 'attachment-item';
if (!exists && !pending) item.classList.add('no-file');
if (pending) item.classList.add('pending');
const info = document.createElement('div');
info.className = 'attachment-info';
const name = document.createElement('div');
name.className = 'attachment-name';
name.textContent = displayname;
const meta = document.createElement('div');
meta.className = 'attachment-meta d-flex gap-8 align-center';
const status = document.createElement('span');
status.className = 'attachment-status';
if (exists) {
status.classList.add('exists');
status.textContent = t('attachmentExists');
} else if (pending) {
status.classList.add('pending');
status.textContent = t('attachmentPending');
} else {
status.classList.add('missing');
status.textContent = t('attachmentMissing');
}
const ext = document.createElement('span');
ext.className = 'badge';
ext.textContent = getExtensionFromMime(mime).toUpperCase().replace('.', '');
meta.appendChild(status);
meta.appendChild(ext);
info.appendChild(name);
info.appendChild(meta);
const actions = document.createElement('div');
actions.className = 'attachment-actions';
if (exists || pending) {
if (exists) {
const dlBtn = document.createElement('button');
dlBtn.className = 'btn btn-sm btn-secondary';
dlBtn.type = 'button';
dlBtn.textContent = t('download');
dlBtn.onclick = () => downloadAttachment(itemName, sysname, mime);
actions.appendChild(dlBtn);
}
const rmBtn = document.createElement('button');
rmBtn.className = 'btn btn-sm btn-danger';
rmBtn.type = 'button';
rmBtn.textContent = t('remove');
rmBtn.onclick = () => {
if (pending) {
delete pendingAttachments[sysname];
generateAttachmentsSection(itemName);
} else {
detachAttachment(itemName, sysname, mime);
}
};
actions.appendChild(rmBtn);
}
item.appendChild(info);
item.appendChild(actions);
section.appendChild(item);
const uploadGroup = document.createElement('div');
uploadGroup.className = 'form-group mb-8';
const fileWrapper = document.createElement('div');
fileWrapper.className = 'file-input-wrapper';
if (pending) fileWrapper.classList.add('has-file');
const icon = document.createElement('span');
icon.className = 'file-input-icon';
icon.innerHTML = '📄';
const text = document.createElement('span');
text.className = 'file-input-text';
text.textContent = pending ? t('fileSelected') + pendingAttachments[sysname].name : t('noFileChosen');
const btn = document.createElement('span');
btn.className = 'file-input-btn';
btn.textContent = t('chooseFile');
const remove = document.createElement('span');
remove.className = 'file-input-remove';
remove.textContent = '✕';
remove.setAttribute('aria-label', 'Очистить выбор');
remove.onclick = (e) => {
e.stopPropagation();
delete pendingAttachments[sysname];
generateAttachmentsSection(itemName);
};
const input = document.createElement('input');
input.type = 'file';
input.className = 'file-input-hidden';
input.accept = mime;
input.onchange = (e) => {
if (e.target.files[0]) {
pendingAttachments[sysname] = e.target.files[0];
generateAttachmentsSection(itemName);
}
};
fileWrapper.appendChild(icon);
fileWrapper.appendChild(text);
fileWrapper.appendChild(btn);
fileWrapper.appendChild(remove);
fileWrapper.appendChild(input);
fileWrapper.onclick = () => input.click();
uploadGroup.appendChild(fileWrapper);
section.appendChild(uploadGroup);
});
}

async function downloadAttachment(itemName, sysname, mime) {
window.open(`${API_BASE}/${currentBlock}/attachment?name=${encodeURIComponent(itemName)}&attachment=${encodeURIComponent(sysname)}&secret=${encodeURIComponent(SECRET)}`, '_blank');
}

async function uploadPendingAttachments(itemName) {
for (const [sysname, file] of Object.entries(pendingAttachments)) {
const mime = blockRequires.attachments.find(([s, m]) => s === sysname)?.[1];
if (!mime) continue;
const formData = new FormData();
formData.append('name', itemName);
formData.append('attachment', sysname);
formData.append('file', file);
formData.append('secret', SECRET);
const res = await fetch(`${API_BASE}/${currentBlock}/attach`, {
method: 'POST',
body: formData
});
const result = await res.json();
if (result.status !== 'ok') {
return false;
}
}
return true;
}

async function detachAttachment(itemName, sysname, mime) {
if (!confirm(t('removeAttachmentConfirm'))) return;
try {
const formData = new FormData();
formData.append('name', itemName);
formData.append('attachment', sysname);
formData.append('secret', SECRET);
const res = await fetch(`${API_BASE}/${currentBlock}/detach`, {
method: 'POST',
body: formData
});
const result = await res.json();
if (result.status === 'ok') {
existingAttachments = existingAttachments.filter(s => s !== sysname);
generateAttachmentsSection(itemName);
}
} catch (e) {}
}

async function openEditModal(itemName) {
hideDragIndicator();
hidePreview();
document.getElementById('itemName').value = itemName;
document.getElementById('currentBlock').value = currentBlock;
document.getElementById('modalTitle').textContent = t('editTitle') + itemName;
existingAttachments = [];
pendingAttachments = {};
try {
const res = await fetch(`${API_BASE}/${currentBlock}/attachments?name=${encodeURIComponent(itemName)}&secret=${encodeURIComponent(SECRET)}`);
if (res.ok) existingAttachments = await res.json();
} catch (e) {}
generateFormFields();
generateAttachmentsSection(itemName);
loadItemData(itemName);
document.getElementById('itemModal').classList.add('active');
}

async function loadItemData(itemName) {
if (!blockRequires || !blockRequires.json) return;
try {
const res = await fetch(`${API_BASE}/${currentBlock}/content?name=${encodeURIComponent(itemName)}&secret=${encodeURIComponent(SECRET)}`, {
headers: {'Cache-Control': 'no-cache'}
});
if (res.status === 404) return;
const data = await res.json();
let hasContent = false;
blockRequires.json.forEach(([sysname, ftype]) => {
const field = document.getElementById(`field_${sysname}`);
if (!field || data[sysname] === undefined) return;
if (ftype === 'bool') {
field.value = (data[sysname] === undefined || data[sysname] === null || data[sysname] === '') ? '' : (data[sysname] ? 'true' : 'false');
} else if (ftype === 'list') {
const tags = Array.isArray(data[sysname]) ? data[sysname] : (data[sysname] || '').split(',').filter(t => t.trim());
tags.forEach(tag => addTag(field, tag.trim()));
} else {
field.value = data[sysname];
}
if (data[sysname] !== undefined && data[sysname] !== null && data[sysname] !== '') {
hasContent = true;
}
});
if (!hasContent && blockRequires.json.length > 0) {
const container = document.getElementById('formFields');
const badge = document.createElement('div');
badge.className = 'badge';
badge.style.width = '100%';
badge.style.justifyContent = 'center';
badge.style.background = 'var(--warning-bg)';
badge.style.color = 'var(--warning)';
badge.style.marginBottom = '12px';
badge.textContent = t('contentEmpty');
container.insertBefore(badge, container.firstChild);
}
} catch (e) {}
}

function closeModal(id) {
document.getElementById(id).classList.remove('active');
if (id === 'createModal') document.getElementById('createName').value = '';
}

function closeModals() {
document.querySelectorAll('.modal').forEach(m => {
m.classList.remove('active');
if (m.id === 'createModal') document.getElementById('createName').value = '';
});
hideDragIndicator();
hidePreview();
}

document.getElementById('langToggle').onclick = toggleLang;
document.getElementById('themeToggle').onclick = toggleTheme;
document.getElementById('logoutBtn').onclick = logout;
document.getElementById('changeSecretBtn').onclick = () => {
document.getElementById('newSecret').value = '';
document.getElementById('confirmSecret').value = '';
hideSecretError();
document.getElementById('secretModal').classList.add('active');
};
document.getElementById('secretModalClose').onclick = () => closeModal('secretModal');
document.getElementById('secretCancelBtn').onclick = () => closeModal('secretModal');
document.getElementById('modalClose').onclick = () => closeModal('itemModal');
document.getElementById('cancelBtn').onclick = () => closeModal('itemModal');
document.getElementById('createModalClose').onclick = () => closeModal('createModal');
document.getElementById('createCancelBtn').onclick = () => closeModal('createModal');
document.getElementById('createBtn').onclick = () => document.getElementById('createModal').classList.add('active');
document.getElementById('ctxHide').onclick = () => {
if (contextTarget) {
toggleVisibility(contextTarget.name, contextTarget.isInvisible);
}
hideContextMenu();
};
document.getElementById('ctxDelete').onclick = () => {
if (contextTarget) {
deleteItem(contextTarget.name);
}
hideContextMenu();
};
document.getElementById('secretForm').onsubmit = async (e) => {
e.preventDefault();
const newSecret = document.getElementById('newSecret').value.trim();
const confirmSecret = document.getElementById('confirmSecret').value.trim();
hideSecretError();
if (!newSecret || !confirmSecret) {
showSecretError(t('error.server'));
return;
}
if (newSecret.length < 6) {
showSecretError(t('secretTooShort'));
return;
}
if (newSecret !== confirmSecret) {
showSecretError(t('secretMismatch'));
return;
}
await changeSecret(newSecret);
};
document.getElementById('itemForm').onsubmit = async (e) => {
e.preventDefault();
const itemName = document.getElementById('itemName').value;
const block = document.getElementById('currentBlock').value;
const data = {};
blockRequires.json.forEach(([sysname, ftype]) => {
const field = document.getElementById(`field_${sysname}`);
if (!field) return;
if (ftype === 'bool') {
data[sysname] = field.value === '' ? null : (field.value === 'true');
} else if (ftype === 'list') {
const tags = field.querySelectorAll('.tag');
data[sysname] = Array.from(tags).map(t => t.firstChild.textContent.trim());
} else if (ftype === 'int') {
const v = parseInt(field.value);
data[sysname] = isNaN(v) ? 0 : v;
} else if (ftype === 'float') {
const v = parseFloat(field.value);
data[sysname] = isNaN(v) ? 0 : v;
} else {
data[sysname] = field.value;
}
});
try {
if (Object.keys(pendingAttachments).length > 0) {
const uploaded = await uploadPendingAttachments(itemName);
if (!uploaded) return;
pendingAttachments = {};
}
const formData = new FormData();
formData.append('name', itemName);
formData.append('data', JSON.stringify(data));
formData.append('secret', SECRET);
const res = await fetch(`${API_BASE}/${block}/content`, {
method: 'POST',
body: formData
});
const result = await res.json();
if (result.status === 'ok') {
closeModal('itemModal');
await loadItems();
}
} catch (e) {}
};
document.getElementById('createForm').onsubmit = async (e) => {
e.preventDefault();
const block = document.getElementById('createBlock').value;
const name = document.getElementById('createName').value.trim();
if (!name) return;
try {
const formData = new FormData();
formData.append('name', name);
formData.append('secret', SECRET);
const res = await fetch(`${API_BASE}/${block}/create`, {
method: 'POST',
body: formData
});
const result = await res.json();
if (result.status === 'ok') {
closeModal('createModal');
document.getElementById('createName').value = '';
await loadItems();
}
} catch (e) {}
};
document.addEventListener('keydown', (e) => {
if (e.key === 'Escape') {
closeModals();
hideContextMenu();
hideDragIndicator();
hidePreview();
}
});
document.addEventListener('click', hideContextMenu);
document.addEventListener('scroll', hideContextMenu);
document.querySelectorAll('.modal').forEach(m => {
m.onclick = (e) => {
if (e.target === m) {
closeModals();
}
};
});
window.addEventListener('resize', () => {
if (currentBlock) {
const activeBtn = document.querySelector('.block-btn.active');
if (activeBtn) updateIndicator(activeBtn);
}
});

initTheme();
initSecret();
applyTranslations();
fetchBlocks();
</script>
</body>
</html>
