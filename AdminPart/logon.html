<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход в систему</title>
<style>
:root[data-theme="light"]{--bg-page:#f0f2f5;--bg-surface:#ffffff;--bg-elevated:#f8f9fa;--text-primary:#1a1a2e;--text-secondary:#4a4a68;--text-muted:#6c757d;--border-subtle:#d0d4dc;--border-default:#c0c5cf;--border-focus:#0056b3;--primary:#0056b3;--primary-hover:#004494;--primary-bg:#cfe4ff;--danger:#b31d28;--danger-hover:#941620;--danger-bg:#ffe0e0;--secondary:#546e7a;--secondary-hover:#455a64;--success:#146c2e;--success-bg:#d4edda;--warning:#b8860b;--warning-bg:#fff3cd;--shadow-sm:0 1px 2px rgba(0,0,0,0.08);--shadow-md:0 2px 8px rgba(0,0,0,0.1);--shadow-lg:0 4px 20px rgba(0,0,0,0.15);--radius-sm:4px;--radius-md:6px;--radius-lg:8px;--focus-ring:0 0 0 3px rgba(0,86,179,0.2);--transition-fast:150ms ease;--transition-normal:250ms ease}
:root[data-theme="dark"]{--bg-page:#0a0c10;--bg-surface:#15181e;--bg-elevated:#1e222b;--text-primary:#e6e6f0;--text-secondary:#a0a0b0;--text-muted:#6c7078;--border-subtle:#2a2f3a;--border-default:#3a3f4a;--border-focus:#3a78f0;--primary:#3a78f0;--primary-hover:#2a68e0;--primary-bg:#1a2540;--danger:#cf6679;--danger-hover:#b35063;--danger-bg:#3a2028;--secondary:#546e7a;--secondary-hover:#455a64;--success:#66bb6a;--success-bg:#1a3528;--warning:#ffa726;--warning-bg:#3a321a;--shadow-sm:0 1px 2px rgba(0,0,0,0.4);--shadow-md:0 2px 8px rgba(0,0,0,0.5);--shadow-lg:0 4px 20px rgba(0,0,0,0.6);--radius-sm:4px;--radius-md:6px;--radius-lg:8px;--focus-ring:0 0 0 3px rgba(58,120,240,0.25);--transition-fast:150ms ease;--transition-normal:250ms ease}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg-page);color:var(--text-primary);line-height:1.5;font-size:14px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-container{width:100%;max-width:420px}
.login-card{background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:40px 32px;border:1px solid var(--border-default)}
.login-header{text-align:center;margin-bottom:32px}
.login-logo{font-size:2.5rem;margin-bottom:16px;display:block}
.login-title{font-size:1.5rem;font-weight:600;color:var(--text-primary);letter-spacing:-0.02em;margin-bottom:8px}
.login-subtitle{font-size:0.875rem;color:var(--text-muted)}
.form-group{margin-bottom:24px}
.form-label{display:block;margin-bottom:8px;font-weight:500;font-size:0.875rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.03em}
.form-input{width:100%;padding:14px 16px;border:1px solid var(--border-default);border-radius:var(--radius-md);font-size:1rem;background:var(--bg-surface);color:var(--text-primary);transition:border-color var(--transition-fast),box-shadow var(--transition-fast);font-family:inherit}
.form-input:focus{outline:none;border-color:var(--border-focus);box-shadow:var(--focus-ring)}
.form-input::placeholder{color:var(--text-muted)}
.form-input.error{border-color:var(--danger);box-shadow:0 0 0 3px rgba(179,29,40,0.1)}
.btn{width:100%;padding:14px 24px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-md);cursor:pointer;font-size:1rem;font-weight:500;transition:background var(--transition-fast);display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,0.3);border-radius:50%;transform:translate(-50%,-50%);transition:width 600ms ease-out,height 600ms ease-out,opacity 600ms ease-out}
.btn:active::before{width:300px;height:300px;opacity:0}
.btn:hover{background:var(--primary-hover)}
.btn:focus{outline:none;box-shadow:var(--focus-ring)}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.btn-loading{position:relative;color:transparent!important}
.btn-loading::after{content:'';position:absolute;width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{color:var(--danger);font-size:0.85rem;margin-top:8px;font-weight:500;display:none;align-items:center;gap:6px}
.error-msg.visible{display:flex}
.error-icon{font-size:1rem}
.login-footer{text-align:center;margin-top:24px;padding-top:24px;border-top:1px solid var(--border-subtle)}
.theme-toggle{background:transparent;color:var(--text-secondary);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:8px 16px;cursor:pointer;font-size:0.875rem;font-weight:500;transition:all var(--transition-fast);display:inline-flex;align-items:center;gap:6px}
.theme-toggle:hover{background:var(--bg-elevated);border-color:var(--border-focus)}
.theme-toggle:focus{outline:none;box-shadow:var(--focus-ring)}
.theme-icon{font-size:1.2rem;transition:transform 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);display:inline-block;transform:rotate(270deg)}
[data-theme="dark"] .theme-icon{transform:rotate(90deg)}
.lang-toggle{background:transparent;color:var(--text-secondary);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:8px 16px;cursor:pointer;font-size:0.875rem;font-weight:500;transition:all var(--transition-fast);display:inline-flex;align-items:center;gap:6px;margin-left:8px}
.lang-toggle:hover{background:var(--bg-elevated);border-color:var(--border-focus)}
.lang-toggle:focus{outline:none;box-shadow:var(--focus-ring)}
.settings-bar{display:flex;justify-content:center;gap:8px;margin-bottom:24px}
.input-wrapper{position:relative}
.input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:1.1rem;pointer-events:none}
.input-icon.toggle{cursor:pointer;pointer-events:auto;color:var(--text-secondary)}
.input-icon.toggle:hover{color:var(--text-primary)}
.shake{animation:shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
</style>
</head>
<body>
<div class="login-container">
<div class="settings-bar">
<button class="theme-toggle" id="themeToggle" type="button">
<span class="theme-icon">🌓</span>
<span id="themeLabel">Тёмная тема</span>
</button>
<button class="lang-toggle" id="langToggle" type="button">
<span>EN</span>
</button>
</div>
<div class="login-card">
<div class="login-header">
<span class="login-logo">🔐</span>
<h1 class="login-title" data-i18n="title">Вход в систему</h1>
<p class="login-subtitle" data-i18n="subtitle">Введите секретный ключ для доступа</p>
</div>
<form id="loginForm" novalidate>
<div class="form-group">
<label class="form-label" for="secretKey" data-i18n="label">СЕКРЕТНЫЙ КЛЮЧ</label>
<div class="input-wrapper">
<input type="password" class="form-input" id="secretKey" required data-i18n-placeholder="placeholder" autocomplete="current-password">
<span class="input-icon toggle" id="toggleVisibility" title="Показать/скрыть">👁</span>
</div>
<div class="error-msg" id="errorMsg">
<span class="error-icon">⚠</span>
<span id="errorText" data-i18n="error">Неверный секретный ключ</span>
</div>
</div>
<button type="submit" class="btn" id="submitBtn" data-i18n="submit">
<span>🔑</span>
<span data-i18n="submitText">Войти</span>
</button>
</form>
<div class="login-footer">
<p class="login-subtitle" data-i18n="footer">Панель управления контентом</p>
</div>
</div>
</div>
<script>
(function() {
    const TRANSLATIONS = {
        ru: {
            title: 'Вход в систему',
            subtitle: 'Введите секретный ключ для доступа',
            label: 'СЕКРЕТНЫЙ КЛЮЧ',
            placeholder: 'Введите ваш секретный ключ...',
            submit: '🔑 Войти',
            submitText: 'Войти',
            error: 'Неверный секретный ключ',
            error404: 'Страница админки не найдена (404)',
            errorNetwork: 'Ошибка сети. Проверьте подключение.',
            footer: 'Панель управления контентом',
            darkTheme: 'Тёмная тема',
            lightTheme: 'Светлая тема',
            autoLogin: 'Выполняется автоматический вход...'
        },
        en: {
            title: 'Login',
            subtitle: 'Enter secret key to access',
            label: 'SECRET KEY',
            placeholder: 'Enter your secret key...',
            submit: '🔑 Login',
            submitText: 'Login',
            error: 'Invalid secret key',
            error404: 'Admin page not found (404)',
            errorNetwork: 'Network error. Check your connection.',
            footer: 'Content Management Panel',
            darkTheme: 'Dark theme',
            lightTheme: 'Light theme',
            autoLogin: 'Auto login in progress...'
        }
    };

    const STORAGE_KEYS = {
        LANGUAGE: 'login_lang',
        THEME: 'theme',
        SECRET_COOKIE: 'admin_secret'
    };

    const COOKIE_OPTIONS = {
        expires: 30 * 60 * 1000,
        path: '/',
        sameSite: 'strict'
    };

    const DOM = {
        root: document.documentElement,
        themeToggle: document.getElementById('themeToggle'),
        themeLabel: document.getElementById('themeLabel'),
        langToggle: document.getElementById('langToggle'),
        toggleVisibility: document.getElementById('toggleVisibility'),
        secretKey: document.getElementById('secretKey'),
        errorMsg: document.getElementById('errorMsg'),
        errorText: document.getElementById('errorText'),
        submitBtn: document.getElementById('submitBtn'),
        loginForm: document.getElementById('loginForm')
    };

    let currentLanguage = localStorage.getItem(STORAGE_KEYS.LANGUAGE) || 'ru';
    let autoLoginInProgress = false;

    function setCookie(name, value, maxAgeMs) {
        const date = new Date();
        date.setTime(date.getTime() + maxAgeMs);
        const expires = `expires=${date.toUTCString()}`;
        document.cookie = `${name}=${encodeURIComponent(value)}; ${expires}; path=/; samesite=strict`;
    }

    function getCookie(name) {
        const cookieName = `${name}=`;
        const cookies = document.cookie.split(';');
        
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.indexOf(cookieName) === 0) {
                return decodeURIComponent(cookie.substring(cookieName.length));
            }
        }
        return null;
    }

    function deleteCookie(name) {
        document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
    }

    function translate(key) {
        return TRANSLATIONS[currentLanguage][key] || key;
    }

    function updateUILanguage() {
        DOM.root.lang = currentLanguage;
        
        DOM.themeLabel.textContent = DOM.root.getAttribute('data-theme') === 'dark' 
            ? translate('lightTheme') 
            : translate('darkTheme');
        
        DOM.langToggle.querySelector('span').textContent = currentLanguage === 'ru' ? 'EN' : 'RU';
        
        document.querySelectorAll('[data-i18n]').forEach(element => {
            const key = element.dataset.i18n;
            element.textContent = translate(key);
        });
        
        document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
            element.placeholder = translate(element.dataset.i18nPlaceholder);
        });
    }

    function toggleLanguage() {
        currentLanguage = currentLanguage === 'ru' ? 'en' : 'ru';
        localStorage.setItem(STORAGE_KEYS.LANGUAGE, currentLanguage);
        updateUILanguage();
    }

    function initializeTheme() {
        const savedTheme = localStorage.getItem(STORAGE_KEYS.THEME);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (prefersDark ? 'dark' : 'light');
        
        DOM.root.setAttribute('data-theme', theme);
        updateThemeLabel();
    }

    function toggleTheme() {
        const currentTheme = DOM.root.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        DOM.root.setAttribute('data-theme', newTheme);
        localStorage.setItem(STORAGE_KEYS.THEME, newTheme);
        updateThemeLabel();
    }

    function updateThemeLabel() {
        DOM.themeLabel.textContent = DOM.root.getAttribute('data-theme') === 'dark' 
            ? translate('lightTheme') 
            : translate('darkTheme');
    }

    function togglePasswordVisibility() {
        const isPassword = DOM.secretKey.type === 'password';
        DOM.secretKey.type = isPassword ? 'text' : 'password';
        DOM.toggleVisibility.textContent = isPassword ? '🙈' : '👁';
        DOM.secretKey.focus();
    }

    function displayErrorMessage(message) {
        DOM.errorText.textContent = message;
        DOM.errorMsg.classList.add('visible');
        DOM.secretKey.classList.add('error');
        
        DOM.secretKey.closest('.login-card').classList.add('shake');
        setTimeout(() => {
            DOM.secretKey.closest('.login-card').classList.remove('shake');
        }, 500);
    }

    function hideErrorMessage() {
        DOM.errorMsg.classList.remove('visible');
        DOM.secretKey.classList.remove('error');
    }

    function saveSecretToCookie(secret) {
        setCookie(STORAGE_KEYS.SECRET_COOKIE, secret, COOKIE_OPTIONS.expires);
    }

    function clearSecretCookie() {
        deleteCookie(STORAGE_KEYS.SECRET_COOKIE);
    }

    async function attemptLogin(secretKey, isAutoLogin = false) {
        hideErrorMessage();

        if (!secretKey) {
            return false;
        }

        if (isAutoLogin) {
            const originalText = DOM.submitBtn.innerHTML;
            DOM.submitBtn.innerHTML = `<span>⏳</span><span>${translate('autoLogin')}</span>`;
            DOM.submitBtn.disabled = true;
        } else {
            DOM.submitBtn.classList.add('btn-loading');
            DOM.submitBtn.disabled = true;
        }

        try {
            const response = await fetch(`/admin?secret=${encodeURIComponent(secretKey)}`, {
                method: 'GET',
                credentials: 'same-origin'
            });

            if (response.status === 200) {
                const contentType = response.headers.get('content-type') || '';
                
                if (contentType.includes('text/html')) {
                    saveSecretToCookie(secretKey);
                    
                    if (!isAutoLogin) {
                        window.location.href = `/admin?secret=${encodeURIComponent(secretKey)}`;
                    } else {
                        window.location.href = `/admin?secret=${encodeURIComponent(secretKey)}`;
                    }
                    return true;
                }
            }
            
            if (!isAutoLogin) {
                displayErrorMessage(translate('error'));
            }

            clearSecretCookie();
            return false;
            
        } catch (error) {
            if (!isAutoLogin) {
                displayErrorMessage(translate('errorNetwork'));
            }
            clearSecretCookie();
            return false;
        } finally {
            if (!isAutoLogin) {
                DOM.submitBtn.classList.remove('btn-loading');
                DOM.submitBtn.disabled = false;
            } else {
                
                DOM.submitBtn.classList.remove('btn-loading');
                DOM.submitBtn.disabled = false;
            }
        }
    }

    async function handleLoginSubmit(event) {
        event.preventDefault();
        
        const secretKey = DOM.secretKey.value.trim();
        
        if (!secretKey) {
            displayErrorMessage(translate('error'));
            return;
        }

        await attemptLogin(secretKey, false);
    }

    async function tryAutoLogin() {
        const savedSecret = getCookie(STORAGE_KEYS.SECRET_COOKIE);
        
        if (savedSecret) {
            DOM.secretKey.value = savedSecret;
            
            autoLoginInProgress = true;
            const success = await attemptLogin(savedSecret, true);
            autoLoginInProgress = false;
            
            if (!success) {
                DOM.secretKey.value = '';
                displayErrorMessage(translate('error'));
            }
        }
    }

    function initializeSavedSecret() {
        const savedSecret = getCookie(STORAGE_KEYS.SECRET_COOKIE);
        if (savedSecret) {
            DOM.secretKey.value = savedSecret;
        }
    }

    DOM.langToggle.addEventListener('click', toggleLanguage);
    DOM.themeToggle.addEventListener('click', toggleTheme);
    DOM.toggleVisibility.addEventListener('click', togglePasswordVisibility);
    DOM.secretKey.addEventListener('input', hideErrorMessage);
    DOM.loginForm.addEventListener('submit', handleLoginSubmit);
    
    DOM.secretKey.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            DOM.loginForm.requestSubmit();
        }
    });

    initializeTheme();
    initializeSavedSecret();
    updateUILanguage();

    tryAutoLogin();
})();
</script>
</body>
</html>
